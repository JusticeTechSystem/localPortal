<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPortal Access | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #ffffff; 
            padding: 32px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
            width: 100%; 
            max-width: 400px; 
        }
        h2 { 
            margin-bottom: 20px; 
            color: #0f172a; 
            text-align: center; 
            font-size: 1.5rem;
            font-weight: 700;
        }
        .form-group { margin-bottom: 18px; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 500; 
            color: #334155; 
            font-size: 0.9rem;
        }
        input, select { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button { 
            width: 100%; 
            background: #2563eb; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .flash { 
            color: #dc2626; 
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem; 
            margin-bottom: 16px; 
            text-align: center; 
            font-weight: 500; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>EduPortal Access</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label for="roleSelect">Login As</label>
                <select name="role" id="roleSelect" onchange="toggleFields()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div class="form-group" id="studentField">
                <label for="student_id">Issued Student ID</label>
                <input type="text" id="student_id" name="student_id" placeholder="e.g. STU-101">
            </div>
            <div class="form-group" id="teacherField" style="display: none;">
                <label for="password">Teacher Password</label>
                <input type="password" id="password" name="password" placeholder="Default: admin123">
            </div>
            <button type="submit">Enter Portal</button>
        </form>
    </div>

    <script>
        function toggleFields() {
            const role = document.getElementById('roleSelect').value;
            document.getElementById('studentField').style.display = role === 'student' ? 'block' : 'none';
            document.getElementById('teacherField').style.display = role === 'teacher' ? 'block' : 'none';
        }
    </script>
</body>
</html>
