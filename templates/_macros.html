{% macro icon(name, size=16) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" aria-hidden="true"><use href="#i-{{ name }}"/></svg>
{%- endmacro %}

{% macro csrf() -%}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}

{% macro flashes() -%}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes" role="status">
    {% for category, message in messages %}
      <div class="flash flash-{{ category if category in ('success','error','info') else 'info' }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
{%- endmacro %}
