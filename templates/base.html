<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <title>{% block title %}{{ school.name }}{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('main.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('main.theme_css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-csrf="{{ csrf_token() }}" data-max-video="{{ max_video_mb }}">
{% include "partials/_sprite.html" %}
{% block body %}{% endblock %}
</body>
</html>
